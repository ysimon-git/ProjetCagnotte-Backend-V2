name: Backend CI

on:
  push:  # push on main
    branches:
      - main

#  pull_request:
#    branches:
#      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest  #start virtual machine

    steps:
      - name: Checkout repository   #checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10   #.net 10 install
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore   #restore
        run: dotnet restore ProjetCagnotte.slnx

      - name: Build   #build
        run: dotnet build ProjetCagnotte.slnx --configuration Release --no-restore

      - name: Run tests  #test
        run: dotnet test ProjetCagnotte.slnx --configuration Release --no-build
